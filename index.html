else if(v.kind==='dog'){const B='#b0814f';px(v,-3,-2,1,2-L,'#6b4423',0);px(v,2,-2,1,2-(v.moving?1-L:0),'#6b4423',0);px(v,-4,-5,8,3,B,lift);px(v,-1,-5,3,2,'#e9dcc0',lift);px(v,4,-7,4,4,B,lift);px(v,7,-5,2,2,'#6b4423',lift);px(v,4,-8,2,2,'#6b4423',lift);px(v,6,-6,1,1,D,lift);px(v,-6,-7+(Math.floor(t*6)%2),2,3,B,lift)}
else if(v.kind==='hen'){const c=v.col;px(v,-2,-4,4,3,c,lift);px(v,2,-6,2,3,c,lift);px(v,4,-5,1,1,'#e8a23a',lift);px(v,2,-7,1,1,'#d95f5f',lift);px(v,-3,-6,1,2,c,lift);px(v,-1,-1,1,1,'#e8a23a',0)}
else if(HUM[v.kind]){const[ht,sh,lg,hr]=HUM[v.kind],lh=Math.round(ht*.3),bh=Math.round(ht*.35);px(v,-1,-lh,1,lh-L,lg,0);px(v,1,-lh,1,lh-(v.moving?1-L:0),lg,0);px(v,-2,-lh-bh,4,bh,sh,lift);px(v,-1,-lh-bh-3,3,3,'#e8b890',lift);px(v,-1,-lh-bh-4,3,1,hr,lift);px(v,1,-lh-bh-2,1,1,D,lift);if(v.kind==='girl')px(v,-2,-lh-bh-3,1,3,hr,lift);if(v.kind==='mum')px(v,-2,-lh-bh-5,2,1,hr,lift)}
else{const fl=v.moving?3+(Math.floor(t*10)%2?-2:0):0;lift=v.moving?4+lift0:0;
px(v,-2,-8,5,7,'#9b7653',lift);px(v,-1,-5,3,3,'#e0cfa8',lift);px(v,-1,-7,1,1,'#f5d94a',lift);px(v,1,-7,1,1,'#f5d94a',lift);
px(v,-2,-10,1,2,'#7a5a3f',lift);px(v,2,-10,1,2,'#7a5a3f',lift);
px(v,-4,-7-fl+(v.moving?0:0),2,4,'#7a5a3f',lift);px(v,3,-7-fl,2,4,'#7a5a3f',lift)}}
function zz(x,y,t){for(let k=0;k<2;k++){const o=((t*.6+k*.5)%1),zx=Math.round(x+k*3+o*3),zy=Math.round(y-o*8);ctx.fillStyle='rgba(241,236,210,'+(1-o)+')';ctx.fillRect(zx,zy,3,1);ctx.fillRect(zx+1,zy+1,1,1);ctx.fillRect(zx,zy+2,3,1)}}
function glow(x,y,r,col,a){ctx.globalCompositeOperation='lighter';for(let k=r;k>0;k-=2){ctx.fillStyle='rgba('+col+','+(a*(1-k/r)*.35+.02)+')';ell(ctx,x,y,k,Math.round(k*.8),ctx.fillStyle)}ctx.globalCompositeOperation='source-over'}
const stars=Array.from({length:40},()=>[Math.floor(rnd()*W),Math.floor(rnd()*50),rnd()*6]);
const flies=Array.from({length:10},()=>[rnd()*W,40+rnd()*60,rnd()*6]);
function frame(t){const dt=Math.min(.05,(t-frame.l)/1000||0);frame.l=t;t/=1000;
if(!paused){hour+=dt*.25*speed;if(hour>=24){hour-=24;day++}}
let mult=Math.min(speed,3);
V.forEach(v=>{const e=entry(v);let[tx,ty]=target(v,e),sm=1;v.act=e[2];v.place=e[1];const o=ovr(v,t);if(o){[tx,ty,v.act,sm]=o;v.place=''}
if(snap){v.x=tx;v.y=ty;v.vx=v.vy=0;v.pth=null;v.pt=null}
nav(v,tx,ty,v.speed*sm*mult,paused?0:dt);
v.hidden=!v.moving&&v.act==='sleeping'});snap=false;
const fx_=V[2],stalk=fx_.act==='stalking the hens';
HENS.forEach(h=>{if(h.dead){if(t>h.rs){h.dead=false;h.x=P.coop[0];h.y=P.coop[1];h.pth=null;h.pt=null;h.vx=h.vy=0}return}
const sc=hour>=20||hour<6||h.flee>t||(stalk&&!foxDay&&Math.hypot(fx_.x-h.x,fx_.y-h.y)<34);let tx,ty;
if(sc){tx=P.coop[0];ty=P.coop[1]}else{h.nt-=dt;if(h.nt<=0){h.nt=2+Math.random()*3;h.tx=P.coop[0]+(Math.random()-.5)*34;h.ty=P.coop[1]+Math.random()*12}tx=h.tx;ty=h.ty}
nav(h,tx,ty,sc?24:9,paused?0:dt*mult);
h.hidden=sc&&Math.hypot(h.x-P.coop[0],h.y-P.coop[1])<6});
ctx.drawImage(bg,0,0);
const list=V.filter(v=>!v.hidden).concat(HENS.filter(h=>!h.hidden&&!h.dead)).sort((a,b)=>a.y-b.y);list.forEach(v=>{ell(ctx,v.x,v.y,v.kind==='owl'?3:4,1,'rgba(59,42,85,.35)');spx.clearRect(0,0,W,H);const m=ctx;ctx=spx;drawV(v,t);ctx=m;
opx.clearRect(0,0,W,H);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>opx.drawImage(sp,a,b));opx.globalCompositeOperation='source-in';opx.fillStyle=D;opx.fillRect(0,0,W,H);opx.globalCompositeOperation='source-over';
ctx.drawImage(oc,0,0);ctx.drawImage(sp,0,0)});
V.filter(v=>v.hidden).forEach(v=>{const h=P['home_'+v.kind];zz(h[0]-2+(v.i>3?(v.i-6)*3:0),h[1]-(v.kind==='owl'?24:v.i>3?20:10),t+v.i)});
for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;p.l-=dt;if(p.l<=0){PART.splice(i,1);continue}ctx.fillStyle='#fff';ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1)}
for(let i=0;i<9;i++){const y=Math.floor((t*16+i*5)%16);ctx.fillStyle=i%2?'#e6f6f8':'#9fd3dc';ctx.fillRect(132+i,y,1,3)}
ctx.fillStyle='#e6f6f8';for(let i=0;i<6;i++)ctx.fillRect(131+i*2+Math.floor(Math.sin(t*5+i)+1),15+(i%2),2,1);
// fire
const fx=96,fy=58,fr=Math.floor(t*7)%3;ctx.fillStyle=D;ctx.fillRect(fx-3,fy,7,2);ctx.fillStyle='#d9743a';ctx.fillRect(fx-2,fy-3-fr%2,5,3+fr%2);ctx.fillStyle='#f4d35e';ctx.fillRect(fx-1,fy-4-fr,3,3);ctx.fillStyle='#fff7c0';ctx.fillRect(fx,fy-2,1,2);
for(let i=0;i<4;i++){const p=(t*.4+i*.25)%1;ctx.fillStyle='rgba(240,235,225,'+.55*(1-p)+')';ctx.fillRect(Math.round(143+Math.sin(p*6+i)*2+p*5),Math.round(49-p*14),2,2)}
for(let i=0;i<6;i++)if(Math.sin(t*2+i*2)>.2){ctx.fillStyle='#a9dde4';ctx.fillRect(86+(i*6)%26,81+(i%3)*3,2,1);ctx.fillRect(130+(i*4)%14,20+(i%3)*2,2,1)}
const lg_=light();for(let i=0;i<3;i++){const cx=((t*3+i*70)%(W+80))-40,cy=22+i*30,c='rgba(30,50,60,'+.14*lg_+')';ell(ctx,cx,cy,22,8,c);ell(ctx,cx+14,cy+3,16,6,c);ell(ctx,cx-12,cy+4,12,5,c)}
if(lg_>.5)for(let i=0;i<5;i++){const bx=Math.round(50+i*28+Math.sin(t*.6+i)*14),by=Math.round(40+i*10+Math.cos(t*.8+i*2)*6);ctx.fillStyle=i%2?'#f4a0c0':'#f4d35e';ctx.fillRect(bx,by,1,1);ctx.fillRect(bx+(Math.floor(t*8+i)%2?1:-1),by-1,1,1)}
// daylight
const d=light(),n=1-d;
const night=[62,72,140],dusk=[255,176,140],day_=[255,255,255];
const c=d<.5?mix(night,dusk,d*2):mix(dusk,day_,(d-.5)*2);
ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgb('+c+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
glow(fx,fy-2,26,'255,150,60',.55+.35*n+Math.sin(t*9)*.05);
if(n>.15)lamps.forEach(l=>glow(l[0],l[1],14,'255,200,90',n));
V.filter(v=>v.hidden).forEach(v=>{const h=P['home_'+v.kind];if(v.kind!=='owl')glow(h[0],h[1]-3,7,'255,190,90',.7)});
if(n>.4){stars.forEach(s=>{ctx.fillStyle='rgba(255,250,220,'+(n-.3)*(.5+.5*Math.sin(t*2+s[2]))+')';ctx.fillRect(s[0],s[1],1,1)});
flies.forEach(f=>{const x=f[0]+Math.sin(t*.5+f[2])*12,y=f[1]+Math.cos(t*.7+f[2]*2)*6;ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(230,240,90,'+(.4+.4*Math.sin(t*3+f[2]))*n+')';ctx.fillRect(Math.round(x),Math.round(y),1,1);ctx.globalCompositeOperation='source-over'})}
clampCam();vis.drawImage(wc,Math.round(cam.x),Math.round(cam.y),VW,VH,0,0,VW,VH);
// hud
const hh=Math.floor(hour),mm=Math.floor((hour-hh)*60/5)*5;
const ph=hour<5||hour>=20?'Night':hour<7?'Dawn':hour<12?'Morning':hour<18?'Afternoon':'Dusk';
const icon=(hour>=6&&hour<19)?'☀':'☾';
document.getElementById('clock').textContent=icon+' '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+' · '+ph+' · Day '+day;
requestAnimationFrame(frame)}
let dr=null;
st.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};st.setPointerCapture(e.pointerId);st.classList.add('drag')};
st.onpointermove=e=>{if(dr){cam.x=dr.cx-(e.clientX-dr.x)/S;cam.y=dr.cy-(e.clientY-dr.y)/S}};
st.onpointerup=st.onpointercancel=()=>{dr=null;st.classList.remove('drag')};
onresize=resize;resize();cam.x=112-VW/2;cam.y=62-VH/2;
requestAnimationFrame(frame);
</script>
